<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 454" width="760" height="454" role="img" aria-labelledby="t d">
  <title id="t">Platba cez payment-simulator</title>
  <desc id="d">E-shop presmeruje zákazníka na simulátor s podpísanou požiadavkou; simulátor prepočíta podpis testovacím kľúčom a zobrazí Sign OK, Wrong sign alebo Missing parameters; pri správnom podpise zákazník zvolí úspešnú, neúspešnú alebo časovo vypršanú platbu a vráti sa na návratovú URL e-shopu s výsledkom podpísaným tak, ako ho podpisuje banka, ktorý e-shop overí.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0e7490"/>
    </marker>
  </defs>
  <rect x="22" y="12" width="210" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="127" y="40" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Prehliadač zákazníka</text>
  <path d="M127 56V444" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 5"/>
  <rect x="275" y="12" width="210" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="40" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Váš e-shop (test. režim)</text>
  <path d="M380 56V444" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 5"/>
  <rect x="528" y="12" width="210" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="633" y="40" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">payment-simulator</text>
  <path d="M633 56V444" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 5"/>
  <path d="M376 134H133" stroke="#0e7490" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="253" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">1. 302 / POST formulár</text>
  <text x="253" y="126" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">podpísané testovacím kľúčom</text>
  <path d="M131 192H627" stroke="#0e7490" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="380" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">2. GET /payment/…</text>
  <text x="380" y="184" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">MID AMT CURR VS RURL … HMAC</text>
  <rect x="515" y="210" width="236" height="48" rx="9" fill="#ecfdf3" stroke="#15803d" stroke-width="1.3"/>
  <text x="633" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">3. prepočíta podpis</text>
  <text x="633" y="247" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">Sign OK · Wrong sign · Missing parameters</text>
  <path d="M629 308H133" stroke="#0e7490" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="380" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">4. continue ok | fail | timeout</text>
  <text x="380" y="300" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">zákazník zvolí odpoveď banky</text>
  <path d="M131 366H374" stroke="#0e7490" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="253" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">5. GET rurl?VS=…&amp;RES=…</text>
  <text x="253" y="358" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">podpísané tak, ako podpisuje banka</text>
  <rect x="262" y="384" width="236" height="48" rx="9" fill="#ecfdf3" stroke="#15803d" stroke-width="1.3"/>
  <text x="380" y="404" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">6. completePurchase()</text>
  <text x="380" y="421" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">overiť, potom označiť objednávku</text>
</svg>
